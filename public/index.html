<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>BBIPL Enterprise Tool</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            min-height:100vh;
            overflow:hidden;
            position:relative;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#000;
        }

        /* Background Image */
        .bg{
            position:absolute;
            inset:0;

            background-image:url('./bg.png');
            background-position:center;
            background-size:cover;
            background-repeat:no-repeat;

            transform:scale(1.05);

            animation:bgZoom 20s ease-in-out infinite alternate;
        }

        @keyframes bgZoom{
            from{
                transform:scale(1.05);
            }
            to{
                transform:scale(1.12);
            }
        }

        /* Light Overlay */
        .overlay{
            position:absolute;
            inset:0;

            background:linear-gradient(
                to bottom right,
                rgba(0,0,0,0.18),
                rgba(15,23,42,0.28)
            );

            backdrop-filter:blur(2px);
        }

        /* Glow Effects */
        .glow1,
        .glow2{
            position:absolute;
            border-radius:50%;
            filter:blur(90px);
            opacity:0.35;
            animation:float 8s ease-in-out infinite;
        }

        .glow1{
            width:320px;
            height:320px;
            background:#2563eb;
            top:-100px;
            left:-100px;
        }

        .glow2{
            width:260px;
            height:260px;
            background:#7c3aed;
            bottom:-90px;
            right:-90px;
            animation-delay:2s;
        }

        @keyframes float{
            0%,100%{
                transform:translateY(0px);
            }
            50%{
                transform:translateY(-25px);
            }
        }

        /* Main Card */
        .container{
            position:relative;
            z-index:10;

            width:90%;
            max-width:540px;

            padding:55px 42px;

            border-radius:30px;

            background:rgba(255,255,255,0.40);

            border:1px solid rgba(255,255,255,0.16);

            backdrop-filter:blur(5px);

            box-shadow:
                0 10px 45px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.08);

            text-align:center;

            animation:fadeUp 1.2s ease;
        }

        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translateY(40px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        /* Logo */
        .logo{
            width:95px;
            height:95px;

            margin:0 auto 28px;

            border-radius:24px;

            background:linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            display:flex;
            justify-content:center;
            align-items:center;

            color:white;

            font-size:40px;
            font-weight:700;

            box-shadow:
                0 10px 35px rgba(37,99,235,0.45);

            animation:pulse 3s infinite;
        }

        @keyframes pulse{
            0%,100%{
                transform:scale(1);
            }
            50%{
                transform:scale(1.06);
            }
        }

        /* Heading */
        h1{
            color:white;
            font-size:36px;
            font-weight:700;
            margin-bottom:14px;
            letter-spacing:0.5px;
        }

        /* Subtitle */
        .subtitle{
            color:rgba(255,255,255,0.78);

            font-size:15px;

            line-height:1.8;

            margin-bottom:38px;
        }

        /* Download Button */
        .download-btn{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:12px;

            padding:17px 34px;

            border-radius:18px;

            text-decoration:none;

            color:white;

            font-size:18px;
            font-weight:600;

            background:linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            box-shadow:
                0 12px 35px rgba(37,99,235,0.45);

            transition:all 0.35s ease;

            position:relative;

            overflow:hidden;
        }

        .download-btn::before{
            content:'';

            position:absolute;

            top:0;
            left:-120%;

            width:100%;
            height:100%;

            background:rgba(255,255,255,0.22);

            transform:skewX(-25deg);

            transition:0.7s;
        }

        .download-btn:hover::before{
            left:120%;
        }

        .download-btn:hover{
            transform:translateY(-4px) scale(1.03);

            box-shadow:
                0 18px 45px rgba(37,99,235,0.55);
        }

        /* Info */
        .info{
            margin-top:30px;

            color:rgba(255,255,255,0.68);

            font-size:13px;

            line-height:1.8;
        }

        /* Company Footer */
        .footer{
            position:absolute;

            bottom:18px;
            left:0;

            width:100%;

            text-align:center;

            color:rgba(255,255,255,0.50);

            font-size:12px;

            letter-spacing:1px;

            z-index:5;
        }

        /* Developer Credit */
        .developer{
            position:absolute;

            bottom:18px;
            right:22px;

            text-align:right;

            color:rgba(255,255,255,0.72);

            font-size:12px;

            line-height:1.6;

            z-index:20;
        }

        .developer span{
            font-weight:600;
            color:white;
        }

        /* Responsive */
        @media(max-width:600px){

            .container{
                padding:42px 26px;
            }

            h1{
                font-size:28px;
            }

            .download-btn{
                width:100%;
            }

            .developer{
                right:12px;
                bottom:12px;
                font-size:10px;
            }

        }

    </style>

</head>

<body>

    <div class="bg"></div>

    <div class="overlay"></div>

    <div class="glow1"></div>

    <div class="glow2"></div>

    <div class="container">

        <div class="logo">B</div>

        <h1>BBIPL Enterprise Tool</h1>

        <p class="subtitle">
            Enterprise Deployment, Diagnostics & Security Toolkit
            <br>
            Fast • Secure • Professional
        </p>

        <a href="/adm.exe" class="download-btn" download>
            ⬇ Download Latest Version
        </a>

        <div class="info">
            Version 1.0
            <br>
            Optimized for Windows Enterprise Environment
        </div>

    </div>

    <div class="footer">
        BIGBOX INTERNATIONAL PVT. LTD.
    </div>

    <div class="developer">
        Developed by <span>Prashant</span><br>
        (IT & Information Security)
    </div>

</body>
</html>
